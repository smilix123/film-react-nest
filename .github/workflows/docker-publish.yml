name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [main, review-2]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Convert username to lowercase
        run: echo "REPO=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - run: echo "repo ${REPO}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: '{{defaultContext}}:backend'
          push: true
          tags: ghcr.io/${{ env.REPO }}/film-react-nest-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: '{{defaultContext}}:frontend'
          push: true
          tags: ghcr.io/${{ env.REPO }}/film-react-nest-frontend:latest

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: '{{defaultContext}}:nginx'
          push: true
          tags: ghcr.io/${{ env.REPO }}/film-react-nest-nginx:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            docker compose pull
            docker compose up -d
            docker image prune -f
